<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clipper — long video in, vertical clips out</title>
<meta name="description" content="Paste a YouTube link and get captioned vertical clips." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0d1b24;
    --ink-2: #14262f;
    --ink-3: #1a323d;
    --line: #23414d;
    --paper: #eef3f4;
    --muted: #8aa6b1;
    --gold: #ffd60a;
    --rose: #ff6b5e;
    --green: #4ade9a;
    --radius: 6px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: Archivo, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 48px 24px 96px; }

  header { margin-bottom: 40px; }
  h1 {
    font-size: clamp(34px, 7vw, 60px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.02;
    margin: 0 0 14px;
  }
  .sub { color: var(--muted); max-width: 46ch; margin: 0; }

  .bar {
    margin-top: 32px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--ink-2);
    display: flex;
    flex-wrap: wrap;
    align-items: stretch;
  }
  .bar input {
    flex: 1 1 320px;
    min-width: 0;
    background: transparent;
    border: 0;
    color: var(--paper);
    font: inherit;
    padding: 18px 20px;
  }
  .bar input::placeholder { color: #5d7c88; }
  .bar input:focus { outline: 2px solid var(--gold); outline-offset: -2px; }
  button.primary {
    background: var(--gold);
    color: #16202a;
    border: 0;
    font: inherit;
    font-weight: 600;
    padding: 18px 28px;
    cursor: pointer;
    border-radius: 0 var(--radius) var(--radius) 0;
  }
  button.primary:hover { background: #ffe14d; }
  button.primary:disabled { background: #3d5560; color: #90a8b2; cursor: not-allowed; }
  button.primary:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }

  /* Stepped progress: named milestones, not just a bar */
  .track { margin-top: 32px; display: none; }
  .track.on { display: block; }
  .steps { display: flex; justify-content: space-between; gap: 8px; }
  .step { flex: 1; text-align: left; }
  .step .dot-row { display: flex; align-items: center; gap: 8px; }
  .step .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #2a4753; flex-shrink: 0;
    transition: background .3s ease;
  }
  .step.done .dot { background: var(--green); }
  .step.active .dot { background: var(--gold); }
  .step .line { flex: 1; height: 1px; background: #2a4753; }
  .step.done .line, .step.active .line { background: var(--green); }
  .step:last-child .line { display: none; }
  .step .label {
    margin-top: 8px; font-size: 12.5px; color: #5d7c88;
    transition: color .3s ease;
  }
  .step.active .label { color: var(--gold); font-weight: 600; }
  .step.done .label { color: var(--green); }

  .stage-line {
    margin-top: 18px; font-size: 15px; color: var(--paper);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .stage-line .pct { color: var(--muted); font-size: 13px; }
  .rail { margin-top: 10px; height: 3px; background: #1d3540; position: relative; overflow: hidden; border-radius: 2px; }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0%; background: var(--gold); transition: width .6s ease; }

  .note {
    margin-top: 28px; padding: 14px 16px;
    border-left: 3px solid var(--rose);
    background: rgba(255,107,94,.08);
    font-size: 15px;
    display: none;
  }
  .note.on { display: block; }

  .reel {
    margin-top: 48px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 28px;
  }
  .clip { border-top: 1px solid var(--line); padding-top: 16px; }
  .clip video {
    width: 100%;
    aspect-ratio: 9 / 16;
    background: #000;
    display: block;
    border-radius: var(--radius);
  }
  .clip h3 { font-size: 17px; margin: 14px 0 6px; font-weight: 600; letter-spacing: -0.01em; }
  .clip p { margin: 0; font-size: 14px; color: var(--muted); }
  .meta { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .meta .dur { font-size: 13px; color: #5d7c88; }
  .dl {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--ink-3); border: 1px solid var(--line); color: var(--paper);
    font: inherit; font-size: 13px; font-weight: 600;
    padding: 8px 14px; border-radius: var(--radius); cursor: pointer;
  }
  .dl:hover { border-color: var(--gold); color: var(--gold); }
  .dl:disabled { opacity: .5; cursor: wait; }
  .dl.done { color: var(--green); border-color: var(--green); }

  footer { margin-top: 72px; border-top: 1px solid var(--line); padding-top: 18px; font-size: 13px; color: #5d7c88; }
  details summary { cursor: pointer; color: var(--muted); }
  .srv { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .srv input { flex: 1 1 260px; padding: 10px 12px; background: var(--ink-2); border: 1px solid var(--line); color: var(--paper); font: inherit; font-size: 14px; border-radius: var(--radius); }
  .srv button { padding: 10px 16px; background: transparent; border: 1px solid var(--line); color: var(--paper); font: inherit; font-size: 14px; border-radius: var(--radius); cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { .fill, .dot, .line, .label { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Long video in.<br />Vertical clips out.</h1>
    <p class="sub">Paste a YouTube link. The server transcribes it, picks the strongest moments, crops them to 9:16 and burns in word-by-word captions.</p>

    <div class="bar">
      <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=…" autocomplete="off" spellcheck="false" />
      <button class="primary" id="go">Make clips</button>
    </div>

    <div class="track" id="track">
      <div class="steps" id="steps"></div>
      <div class="stage-line"><span id="stageText">Starting…</span><span class="pct" id="pct">0%</span></div>
      <div class="rail"><div class="fill" id="fill"></div></div>
    </div>

    <div class="note" id="note"></div>
  </header>

  <div class="reel" id="reel"></div>

  <footer>
    <details>
      <summary>Server settings</summary>
      <div class="srv">
        <input id="backend" placeholder="https://your-app.b4a.run" />
        <button id="saveBackend">Save</button>
      </div>
      <p style="margin-top:10px">Clips are deleted from the server after a couple of hours. Download anything you want to keep.</p>
    </details>
  </footer>
</div>

<script src="config.js"></script>
<script>
  const DEFAULT_BACKEND = (window.BACKEND_URL || "").replace(/\/+$/, "");
  const stored = localStorage.getItem("clipper_backend");
  let BACKEND = (stored || DEFAULT_BACKEND || window.location.origin).replace(/\/+$/, "");

  const $ = (id) => document.getElementById(id);
  const goBtn = $("go"), note = $("note"), reel = $("reel");
  const track = $("track"), fill = $("fill"), stageText = $("stageText"), pctEl = $("pct");
  const stepsEl = $("steps");

  $("backend").value = BACKEND;
  $("saveBackend").onclick = () => {
    BACKEND = $("backend").value.trim().replace(/\/+$/, "");
    localStorage.setItem("clipper_backend", BACKEND);
    showNote("Server set to " + BACKEND);
  };

  function showNote(msg) { note.textContent = msg; note.classList.add("on"); }
  function clearNote() { note.classList.remove("on"); note.textContent = ""; }

  // Named milestones mapped to the progress percentage the backend reports
  // at each stage (see server.js setStage calls). Falls back gracefully
  // if a simpler backend only ever reports 0 and 100.
  const MILESTONES = [
    { label: "Download", at: 5 },
    { label: "Transcribe", at: 30 },
    { label: "Find moments", at: 55 },
    { label: "Render clips", at: 60 },
  ];

  function renderSteps(progress) {
    stepsEl.innerHTML = MILESTONES.map((m, i) => {
      const next = MILESTONES[i + 1];
      const isDone = progress >= (next ? next.at : 100);
      const isActive = !isDone && progress >= m.at;
      const cls = isDone ? "done" : isActive ? "active" : "";
      return `<div class="step ${cls}"><div class="dot-row"><div class="dot"></div><div class="line"></div></div><div class="label">${m.label}</div></div>`;
    }).join("");
  }

  function setProgress(stage, pct) {
    track.classList.add("on");
    const p = pct || 0;
    stageText.textContent = stage;
    pctEl.textContent = Math.round(p) + "%";
    fill.style.width = p + "%";
    renderSteps(p);
  }

  goBtn.onclick = async () => {
    const youtubeUrl = $("url").value.trim();
    if (!youtubeUrl) { showNote("Paste a YouTube link first."); return; }

    clearNote();
    reel.innerHTML = "";
    goBtn.disabled = true;
    setProgress("Sending to the server…", 2);

    try {
      const res = await fetch(BACKEND + "/api/clip", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ youtubeUrl })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || ("Server returned " + res.status));
      poll(data.jobId, 0);
    } catch (err) {
      goBtn.disabled = false;
      track.classList.remove("on");
      showNote("Could not reach the server. " + err.message +
        " — check the URL under Server settings, and that the container is running.");
    }
  };

  async function poll(jobId, failures) {
    let job;
    try {
      const res = await fetch(BACKEND + "/api/clip/" + jobId);
      job = await res.json();
      if (!res.ok) throw new Error(job.error || "job lookup failed");
    } catch (err) {
      if (failures > 8) {
        goBtn.disabled = false;
        showNote("Lost contact with the server: " + err.message);
        return;
      }
      return setTimeout(() => poll(jobId, failures + 1), 5000);
    }

    if (job.status === "done") {
      setProgress("Done", 100);
      render(job.clips);
      goBtn.disabled = false;
      return;
    }
    if (job.status === "error") {
      track.classList.remove("on");
      goBtn.disabled = false;
      showNote(job.error || "The job failed.");
      return;
    }

    setProgress(job.stage || "Working…", job.progress || 0);
    if (job.clips && job.clips.length) render(job.clips);
    setTimeout(() => poll(jobId, 0), 4000);
  }

  function esc(s) {
    return String(s || "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
  }

  function absoluteUrl(u) {
    try { return new URL(u, BACKEND).href; } catch { return u; }
  }

  // Browsers ignore the plain `download` attribute for cross-origin links
  // in many cases (exactly our setup: the page is on Netlify, the video is
  // on the tunnel/backend domain) -- it just opens the video instead of
  // saving it. Fetching the file as a blob and saving that always works,
  // regardless of origin, as long as the server allows CORS (ours does).
  async function downloadClip(url, filename, btn) {
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Downloading…";
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error("Download failed (" + res.status + ")");
      const blob = await res.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = blobUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(blobUrl);
      btn.textContent = "Saved";
      btn.classList.add("done");
      setTimeout(() => { btn.textContent = original; btn.classList.remove("done"); btn.disabled = false; }, 2000);
    } catch (err) {
      btn.textContent = "Failed — retry";
      btn.disabled = false;
      showNote("Couldn't download that clip: " + err.message);
    }
  }

  function render(clips) {
    reel.innerHTML = clips.map((c, i) => `
      <article class="clip">
        <video controls preload="metadata" playsinline src="${esc(absoluteUrl(c.url))}"></video>
        <h3>${esc(c.title)}</h3>
        <p>${esc(c.reason)}</p>
        <div class="meta">
          <span class="dur">${c.duration ? c.duration + "s" : ""}</span>
          <button class="dl" data-i="${i}">Download</button>
        </div>
      </article>`).join("");

    reel.querySelectorAll(".dl").forEach((btn) => {
      const c = clips[Number(btn.dataset.i)];
      btn.onclick = () => downloadClip(absoluteUrl(c.url), (c.title || "clip").replace(/[^a-z0-9]+/gi, "_") + ".mp4", btn);
    });
  }
</script>
</body>
</html>
